<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Management</title>
</head>
<body>
    <h1>User Management</h1>

    <!-- Login -->
    <div>
        <h2>Login</h2>
        <input type="text" id="loginUsername" placeholder="Username">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="loginStatus"></p>
    </div>

    <!-- Register -->
    <div>
        <h2>Register</h2>
        <input id="regEmail" placeholder="E-Mail">
        <input id="regUsername" placeholder="Username">
        <input id="regPassword" type="password" placeholder="Passwort">
        <button onclick="register()">Register</button>
    </div>

    <script>
        let token = "";

async function login() {
    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;

    // validation
    if (!username || !password) {
        alert("Please enter username and password");
        return;
    }

    try {
        const response = await fetch("http://127.0.0.1:8000/login/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        // Backend error
        if (!response.ok) {
            alert(data.detail || "Login failed");
            return;
        }

        // save Token
        localStorage.setItem("token", data.access_token);

        // redirection
        window.location.href = "/dashboard.html";

    } catch (error) {
        console.error(error);
        alert("Server not available");
    }
}

        // Delete user function
        async function deleteUser() {
            if (!token) {
                document.getElementById("deleteStatus").innerText = "Please log in first!";
                return;
            }

            try {
                const response = await fetch("http://127.0.0.1:8000/users/me", {
                    method: "DELETE",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                });

                if (response.ok) {
                    document.getElementById("deleteStatus").innerText = "User deleted successfully!";
                } else {
                    const result = await response.json();
                    document.getElementById("deleteStatus").innerText = "Error: " + JSON.stringify(result);
                }
            } catch (error) {
                document.getElementById("deleteStatus").innerText = "Error: " + error;
            }
        }

    async function register() {
        const email = document.getElementById("regEmail").value;
        const username = document.getElementById("regUsername").value;
        const password = document.getElementById("regPassword").value;

        const response = await fetch("http://127.0.0.1:8000/register/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,
                name: username,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.detail);
        } else {
            alert("registration successful!");
        }
    }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Board Game Tool</title>

    <style>
        #language-switcher {
    position: fixed;
    top: 10px;
    right: 10px;
}
    </style>
</head>
<body>
<div id="language-switcher">
    <button onclick="loadLanguage('de')">DE</button>
    <button onclick="loadLanguage('en')">EN</button>
</div>
    <h1>Board Game Tool</h1>

    <!-- Login -->
    <div>
        <h2 data-i18n="login_process"></h2>
        <input type="text" id="loginUsername" data-i18n-placeholder="username">
        <input type="password" id="loginPassword" data-i18n-placeholder="password">
        <button onclick="login()" data-i18n="login"></button>
        <p id="loginStatus"></p>
    </div>

    <!-- Register -->
    <div>
        <h2 data-i18n="registration"></h2>
        <input id="regEmail" data-i18n-placeholder="e-mail">
        <input id="regUsername" data-i18n-placeholder="username">
        <input id="regPassword" type="password" data-i18n-placeholder="password">
        <button onclick="register()" data-i18n="register"></button>
    </div>

<script src="/script/i18n.js"></script>
<script>
    let token = localStorage.getItem("token") || "";

    async function login() {
    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;

    if (!username || !password) {
        alert("Please enter username and password");
        return;
    }

    try {
        const response = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams({
                username: username,
                password: password
            })
        });

        const data = await response.json();

        if (!response.ok) {
            alert(data.detail || "Login failed");
            return;
        }

        localStorage.setItem("token", data.access_token);
        window.location.href = "/dashboard.html";

    } catch (error) {
        console.error(error);
        alert("Server not available");
    }
}

    async function register() {
        const email = document.getElementById("regEmail").value;
        const username = document.getElementById("regUsername").value;
        const password = document.getElementById("regPassword").value;

        try {
            const response = await fetch("/register/", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({
    name: username,
    email: email,
    password: password
  })
});

            const data = await response.json();

            if (!response.ok) {
                alert(data.detail || "Registration failed");
            } else {
                alert("Registration successful!");
            }

        } catch (error) {
            console.error(error);
            alert("Server not available");
        }
    }

    async function deleteUser() {
        if (!token) {
            alert("Please log in first!");
            return;
        }

        try {
            const response = await fetch(`/users/me/`, {
                method: "DELETE",
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (response.ok) {
                alert("User deleted successfully!");
            } else {
                const result = await response.json();
                alert("Error: " + JSON.stringify(result));
            }

        } catch (error) {
            console.error(error);
            alert("Server not available");
        }
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
</head>
<body>

<h1>My Account</h1>

<!-- Account Infos -->
<div>
    <h2>Account data</h2>
    <p><b>E-Mail:</b> <span id="email"></span></p>
    <p><b>Username:</b> <span id="username"></span></p>
</div>

<hr>

<!-- My games -->
<div>
    <h2>My games</h2>

    <select id="gameSelect"></select>
    <button onclick="addSelectedGame()">Add Game</button>
        <ul id="gameList"></ul>
</div>

<hr>

<!-- Delete User -->
<div>
    <h2>Delete User</h2>
    <button onclick="deleteUser()">Delete User</button>
</div>

<script>

    const allGames = [
    { key: "kingdom_builder", name: "Kingdom Builder" }
];

function renderGameDropdown() {
    const select = document.getElementById("gameSelect");
    select.innerHTML = "";

    // Nur Spiele anzeigen, die noch nicht hinzugefügt wurden
    const availableGames = allGames.filter(
        game => !games.includes(game.key)
    );

    if (availableGames.length === 0) {
        const option = document.createElement("option");
        option.text = "All games added";
        option.disabled = true;
        select.appendChild(option);
        return;
    }

    availableGames.forEach(game => {
        const option = document.createElement("option");
        option.value = game.key;
        option.text = game.name;
        select.appendChild(option);
    });
}

function addSelectedGame() {
    const select = document.getElementById("gameSelect");
    const selectedGame = select.value;

    if (!selectedGame) return;

    games.push(selectedGame);
    saveGames();
    renderGames();
    renderGameDropdown();
}

const token = localStorage.getItem("token");

// Login-Check
if (!token) {
    window.location.href = "/static/index.html";
}

const username = localStorage.getItem("username"); // oder aus /me/
const gameKey = `games_${username}`;

let games = JSON.parse(localStorage.getItem(gameKey)) || [];

function saveGames() {
  localStorage.setItem(gameKey, JSON.stringify(games));
}

// load account
async function loadAccount() {
    try {
        console.log("Fetching /me/ with token:", token); // Debug

        const res = await fetch("/me/", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        console.log("Response status:", res.status); // Debug

        if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            console.error("Error response:", errData);
            localStorage.removeItem("token");
            window.location.href = "/static/index.html";
            return;
        }

        const data = await res.json();
        console.log("User data received:", data); // Debug

        document.getElementById("email").innerText = data.email;
        document.getElementById("username").innerText = data.name;
    } catch (err) {
        console.error("Network error /me/:", err);
        alert("Could not load account: " + err);
    }
}


// show games
function renderGames() {
    const list = document.getElementById("gameList");
    list.innerHTML = "";

    games.forEach(game => {
        const li = document.createElement("li");

        const btn = document.createElement("button");
        btn.innerText = game === "kingdom_builder" ? "Kingdom Builder" : game;
        btn.onclick = () => {
            window.location.href = `/static/${game}.html`;
        };

        li.appendChild(btn);
        list.appendChild(li);
    });
}

// Add game
function addGame(gameName) {
    if (!games.includes(gameName)) {
        games.push(gameName);
        saveGames();
        renderGames();
        renderGameDropdown();
        console.log("Button:", document.getElementById('addKingdomBuilder'));
    } else {
        alert("game is already added");
    }
}

// Delete User
async function deleteUser() {
    if (!confirm("Do you want to delete your account?")) return;

    const res = await fetch(`/users/me/`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
    });

    if (res.ok) {
        localStorage.clear();
        alert("Account deleted");
        window.location.href = "/static/index.html";
    } else {
        alert("Deleting account failed");
    }
}

// Initial
loadAccount();
renderGames();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

        <style>
        #language-switcher {
    position: fixed;
    top: 10px;
    right: 10px;
}
    </style>
</head>
<body>


<div id="language-switcher">
    <button onclick="loadLanguage('de')">DE</button>
    <button onclick="loadLanguage('en')">EN</button>
</div>

<!-- Account Infos -->
<div>
    <h2 data-i18n="my_profile"></h2>
    <p><b><span data-i18n="e-mail">E-Mail</span>:</b> <span id="email"></span></p>
    <p><b><span data-i18n="username">Username</span>:</b> <span id="username"></span></p>
    <button onclick="logout()" data-i18n="logout"></button>
</div>

<hr>

<!-- My games -->
<div>
    <h2 data-i18n="my_games"></h2>

    <select id="gameSelect"></select>
    <button onclick="addSelectedGame()" data-i18n="add_game"></button>
        <ul id="gameList"></ul>
</div>

<hr>

<!-- Delete User -->
<div>
    <h2 data-i18n="delete_account"></h2>
    <button onclick="deleteUser()" data-i18n="delete_account"></button>
</div>


<script src="/script/i18n.js"></script>
<script>
const token = localStorage.getItem("token");

if (!token) {
    window.location.href = "/static/index.html";
}

let allBoardGames = [];
let myBoardGames = [];

/* =========================
   ACCOUNT
========================= */

async function loadAccount() {
    const res = await fetch("/me/", {
        headers: { Authorization: "Bearer " + token }
    });

    if (!res.ok) {
        localStorage.removeItem("token");
        window.location.href = "/static/index.html";
        return;
    }

    const data = await res.json();
    document.getElementById("email").innerText = data.email;
    document.getElementById("username").innerText = data.name;
}

/* =========================
   LOAD DATA
========================= */

async function loadBoardGames() {
    const res = await fetch("/boardgames");
    allBoardGames = await res.json();
}

async function loadMyBoardGames() {
    const res = await fetch("/users/me/boardgames", {
        headers: { Authorization: "Bearer " + token }
    });
    myBoardGames = await res.json();
}

/* =========================
   RENDER
========================= */

function renderMyGames() {
    const list = document.getElementById("gameList");
    list.innerHTML = "";

    myBoardGames.forEach(game => {
        const li = document.createElement("li");

        const btn = document.createElement("button");
        btn.innerText = game.name;

        // Load html of clicked game button
        btn.onclick = () => {
            window.location.href = `/static/${game.name.toLowerCase().replace(" ", "_")}.html`;
        };

        li.appendChild(btn);
        list.appendChild(li);
    });
}

function renderDropdown() {
    const select = document.getElementById("gameSelect");
    select.innerHTML = "";

    const myIds = myBoardGames.map(g => g.id);

    const available = allBoardGames.filter(g => !myIds.includes(g.id));

    if (available.length === 0) {
        const option = document.createElement("option");
        option.text = "All games added";
        option.disabled = true;
        select.appendChild(option);
        return;
    }

    available.forEach(game => {
        const option = document.createElement("option");
        option.value = game.id;
        option.text = game.name;
        select.appendChild(option);
    });
}

/* =========================
   ADD GAME
========================= */

async function addSelectedGame() {
    const select = document.getElementById("gameSelect");
    const gameId = select.value;

    if (!gameId) return;

    await fetch(`/users/me/boardgames/${gameId}`, {
        method: "POST",
        headers: { Authorization: "Bearer " + token }
    });

    await refreshGames();
}

/* =========================
   REFRESH
========================= */

async function refreshGames() {
    await loadMyBoardGames();
    renderMyGames();
    renderDropdown();
}

/* =========================
   DELETE USER
========================= */

async function deleteUser() {
    if (!confirm("Do you want to delete your account?")) return;

    const res = await fetch(`/users/me/`, {
        method: "DELETE",
        headers: { Authorization: "Bearer " + token }
    });

    if (res.ok) {
        localStorage.clear();
        alert("Account deleted");
        window.location.href = "/static/index.html";
    } else {
        alert("Deleting account failed");
    }
}


/* =========================
   LOGOUT USER
========================= */

function logout() {
  localStorage.removeItem("token");
  localStorage.removeItem("username");
  window.location.href = "/static/index.html";
}


/* =========================
   INITIAL LOAD
========================= */

async function init() {
    await loadAccount();
    await loadBoardGames();
    await loadMyBoardGames();
    renderMyGames();
    renderDropdown();
}

init();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

        <style>
        #language-switcher {
    position: fixed;
    top: 10px;
    right: 10px;
}
    </style>
</head>
<body>


<div id="language-switcher">
    <button onclick="loadLanguage('de')">DE</button>
    <button onclick="loadLanguage('en')">EN</button>
</div>

<!-- Account Infos -->
<div>
    <h2 data-i18n="my_profile"></h2>
    <p><b><span data-i18n="e-mail">E-Mail</span>:</b> <span id="email"></span></p>
    <p><b><span data-i18n="username">Username</span>:</b> <span id="username"></span></p>
    <button onclick="logout()" data-i18n="logout"></button>
</div>

<hr>

<!-- My games -->
<div>
    <h2 data-i18n="my_games"></h2>

    <select id="gameSelect"></select>
    <button onclick="addSelectedGame()" data-i18n="add_game"></button>
        <ul id="gameList"></ul>
    <button onclick="addGame('kingdom_builder')">
        add Kingdom Builder
    </button>

    <ul id="gameList"></ul>
</div>

<hr>

<!-- Delete User -->
<div>
    <h2 data-i18n="delete_account"></h2>
    <button onclick="deleteUser()" data-i18n="delete_account"></button>
</div>


<script src="/script/i18n.js"></script>
<script>
const token = localStorage.getItem("token");

// Login-Check
if (!token) {
    window.location.href = "/static/index.html";
}

// selected games (local)
let games = JSON.parse(localStorage.getItem("games")) || [];

// load account
async function loadAccount() {
    try {
        console.log("Fetching /me/ with token:", token); // Debug

        const res = await fetch("/me/", {
            headers: {
                "Authorization": "Bearer " + token
            }
        });

        console.log("Response status:", res.status); // Debug

        if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            console.error("Error response:", errData);
            localStorage.removeItem("token");
            window.location.href = "/static/index.html";
            return;
        }

        const data = await res.json();
        console.log("User data received:", data); // Debug

        document.getElementById("email").innerText = data.email;
        document.getElementById("username").innerText = data.name;
    } catch (err) {
        console.error("Network error /me/:", err);
        alert("Could not load account: " + err);
    }
}


// show games
function renderGames() {
    const list = document.getElementById("gameList");
    list.innerHTML = "";

    games.forEach(game => {
        const li = document.createElement("li");

        const btn = document.createElement("button");
        btn.innerText = game === "kingdom_builder" ? "Kingdom Builder" : game;
        btn.onclick = () => {
            window.location.href = `/static/${game}.html`;
        };

        li.appendChild(btn);
        list.appendChild(li);
    });
}

// Add game
function addGame(gameName) {
    if (!games.includes(gameName)) {
        games.push(gameName);
        localStorage.setItem("games", JSON.stringify(games));
        renderGames();
    } else {
        alert("game is already added");
    }
}

// Delete User
async function deleteUser() {
    if (!confirm("Do you want to delete your account?")) return;

    const res = await fetch(`/users/me/`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
    });

    if (res.ok) {
        localStorage.clear();
        alert("Account deleted");
        window.location.href = "/static/index.html";
    } else {
        alert("Deleting account failed");
    }
}


/* =========================
   LOGOUT USER
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Kingdom Builder - Create Match</title>
<style>
  body {
    display: flex;
    font-family: Arial, sans-serif;
    gap: 20px;
    padding: 20px;
  }

  .left-panel { flex: 1; max-width: 400px; }
  .right-panel { flex: 2; border: 1px solid #ccc; padding: 10px; min-height: 300px; }

  #playerInputContainer { position: relative; width: 100%; margin-top: 10px; }
  #playerInput { width: 100%; padding: 5px; }

  #suggestions { border: 1px solid #ccc; max-height: 150px; overflow-y: auto; position: absolute; background: white; width: 100%; z-index: 10; }
  .suggestion-item { padding: 5px; cursor: pointer; }
  .suggestion-item:hover { background-color: #eee; }

  #selectedPlayers { margin-top: 10px; }
  .player-tag { display: inline-block; padding: 5px 10px; background-color: #007bff; color: white; border-radius: 15px; margin: 3px; cursor: pointer; }
  .player-tag:hover { background-color: #0056b3; }

  button { margin-top: 10px; padding: 8px 12px; opacity: 0.5; cursor: not-allowed; }
  button.enabled { opacity: 1; cursor: pointer; }

  table { border-collapse: collapse; width: 100%; margin-top: 10px; }
  table, th, td { border: 1px solid #ccc; }
  th, td { padding: 5px; text-align: center; }

  /* Remove number input arrows */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  input.score-input { width: 50px; text-align: center; }

  .map-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
  .map-tile { border: 1px solid #444; padding: 10px; text-align: center; background: #f9f9f9; }
  .map-title { font-weight: bold; margin-bottom: 5px; }
  .map-meta { font-size: 0.9em; color: #555; }
</style>
</head>
<body>

<div class="left-panel">
  <h1>Kingdom Builder</h1>

  <label>Spieleranzahl:</label>
  <select id="playerCount">
    <option value="">Bitte auswählen</option>
    <option value="2">2 Spieler</option>
    <option value="3">3 Spieler</option>
    <option value="4">4 Spieler</option>
    <option value="5">5 Spieler</option>
  </select>

  <h3>Spieler auswählen</h3>
  <div id="playerInputContainer">
    <input type="text" id="playerInput" placeholder="Spielername eingeben..." disabled>
    <div id="suggestions"></div>
  </div>

  <div id="selectedPlayers"></div>
  <p>Ausgewählte Spieler: <span id="playerCountDisplay">0</span></p>

  <button id="startGameBtn" disabled>Spiel starten</button>
</div>

<div class="right-panel">
  <h3>Match Einstellungen</h3>
  <div id="matchSettings">Noch kein Spiel erstellt.</div>

  <h3>Aufgaben & Punkte</h3>
  <div id="tasksContainer"></div>
  <button id="saveScoresBtn" disabled>Punkte speichern</button>
</div>

<script>
const API_URL = "http://127.0.0.1:8000";
const token = localStorage.getItem("token");

if (!token) window.location.href = "/static/index.html";

// --- Global variables ---
let users = [];
let selectedPlayers = [];
let currentTasks = [];
let currentMatch = null;
let MAX_PLAYERS = 0;

const input = document.getElementById("playerInput");
const suggestions = document.getElementById("suggestions");
const selectedContainer = document.getElementById("selectedPlayers");
const countDisplay = document.getElementById("playerCountDisplay");
const startBtn = document.getElementById("startGameBtn");
const matchSettingsDiv = document.getElementById("matchSettings");
const tasksContainer = document.getElementById("tasksContainer");
const saveScoresBtn = document.getElementById("saveScoresBtn");

// --- Fetch users from API ---
async function fetchUsers() {
    const res = await fetch(`${API_URL}/users/`, {
        headers: { Authorization: `Bearer ${token}` }
    });
    users = await res.json();
}
fetchUsers();

// --- Player count selection ---
document.getElementById("playerCount").addEventListener("change", e => {
    MAX_PLAYERS = parseInt(e.target.value) || 0;
    selectedPlayers = [];
    renderSelectedPlayers();
    input.disabled = MAX_PLAYERS === 0;
    updateStartButton();
});

// --- Show suggestions while typing ---
input.addEventListener("input", () => {
    const q = input.value.toLowerCase();
    suggestions.innerHTML = "";
    if (!q) return;

    users.filter(u =>
        u.name.toLowerCase().includes(q) &&
        !selectedPlayers.includes(u.name)
    ).forEach(u => {
        const div = document.createElement("div");
        div.textContent = u.name;
        div.className = "suggestion-item";
        div.onclick = () => addPlayer(u.name);
        suggestions.appendChild(div);
    });
});

// --- Add player ---
function addPlayer(name) {
    if (selectedPlayers.length >= MAX_PLAYERS) return;
    selectedPlayers.push(name);
    input.value = "";
    suggestions.innerHTML = "";
    renderSelectedPlayers();
    updateStartButton();
}

// --- Remove player ---
function removePlayer(name) {
    selectedPlayers = selectedPlayers.filter(p => p !== name);
    renderSelectedPlayers();
    updateStartButton();
}

// --- Render selected players ---
function renderSelectedPlayers() {
    selectedContainer.innerHTML = "";
    selectedPlayers.forEach(p => {
        const span = document.createElement("span");
        span.textContent = p;
        span.className = "player-tag";
        span.onclick = () => removePlayer(p);
        selectedContainer.appendChild(span);
    });
    countDisplay.textContent = selectedPlayers.length;
}

// --- Enable / disable start button ---
function updateStartButton() {
    if (selectedPlayers.length === MAX_PLAYERS && MAX_PLAYERS > 0) {
        startBtn.disabled = false;
        startBtn.classList.add("enabled");
    } else {
        startBtn.disabled = true;
        startBtn.classList.remove("enabled");
    }
}

// --- Start game ---
startBtn.addEventListener("click", async () => {
    if (selectedPlayers.length !== MAX_PLAYERS || MAX_PLAYERS === 0) return;

    try {
        const res = await fetch(`${API_URL}/start_kingdom_builder/`, {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(selectedPlayers)
        });

        currentMatch = await res.json();

        if (!res.ok) {
            alert("Error creating match: " + JSON.stringify(currentMatch.detail || currentMatch));
            console.log("Match creation error:", currentMatch);
            return;
        }

        console.log("Match created:", currentMatch);

        // --- Render Map & Match Settings ---
        matchSettingsDiv.innerHTML = "";
        matchSettingsDiv.appendChild(renderMap(currentMatch.map));
        matchSettingsDiv.innerHTML += `
            <p><strong>Island:</strong> ${currentMatch.island}</p>
            <p><strong>Caves:</strong> ${currentMatch.caves}</p>
            <p><strong>Capitols:</strong> ${currentMatch.capitols}</p>
        `;

        // --- Render Tasks ---
        currentTasks = currentMatch.tasks;
        console.log("Tasks loaded:", currentTasks);
        renderTasks();

    } catch (err) {
        console.error("Error connecting to server:", err);
        alert("Error connecting to server");
    }
});

// --- Render map ---
function renderMap(map) {
    const grid = document.createElement("div");
    grid.className = "map-grid";

    map.forEach(tile => {
        const [id, expansion, name, orientation] = tile;
        const div = document.createElement("div");
        div.className = "map-tile";
        div.innerHTML = `
            <div class="map-title">${name}</div>
            <div class="map-meta">${expansion} · ${orientation === "upright" ? "↑ upright" : "↺ reversed"}</div>
        `;
        grid.appendChild(div);
    });

    return grid;
}

// --- Render tasks and score inputs ---
function renderTasks() {
    tasksContainer.innerHTML = "";
    if (!currentTasks || currentTasks.length === 0) {
        tasksContainer.textContent = "Keine Aufgaben vorhanden.";
        saveScoresBtn.disabled = true;
        saveScoresBtn.classList.remove("enabled");
        return;
    }

    const table = document.createElement("table");

    // Header row
    const thead = document.createElement("thead");
    const headerRow = document.createElement("tr");
    const thTask = document.createElement("th");
    thTask.textContent = "Aufgabe";
    headerRow.appendChild(thTask);

    selectedPlayers.forEach(player => {
        const th = document.createElement("th");
        th.textContent = player;
        headerRow.appendChild(th);
    });

    thead.appendChild(headerRow);
    table.appendChild(thead);

    // Table body
    const tbody = document.createElement("tbody");
    currentTasks.forEach(task => {
        const taskName = String(task.name);
        const tr = document.createElement("tr");

        const tdTask = document.createElement("td");
        tdTask.textContent = taskName;
        tr.appendChild(tdTask);

        selectedPlayers.forEach(() => {
            const td = document.createElement("td");
            const input = document.createElement("input");
            input.type = "number";
            input.className = "score-input";
            input.value = 0;

            // live total update
            input.addEventListener("input", recalculateTotals);
            td.appendChild(input);
            tr.appendChild(td);
        });

        tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    tasksContainer.appendChild(table);

    // --- Total score row ---
const totalRow = document.createElement("tr");
totalRow.id = "totalRow";

const totalLabel = document.createElement("td");
totalLabel.textContent = "Gesamt";
totalLabel.style.fontWeight = "bold";
totalRow.appendChild(totalLabel);

selectedPlayers.forEach(() => {
    const td = document.createElement("td");
    td.textContent = "0";
    td.className = "total-cell";
    totalRow.appendChild(td);
});

tbody.appendChild(totalRow);

    // Enable save scores button
    saveScoresBtn.disabled = false;
    saveScoresBtn.classList.add("enabled");
}

// --- Save Scores Button ---
saveScoresBtn.addEventListener("click", () => {
    const table = tasksContainer.querySelector("table");
    if (!table) return;

    const scores = {};
    const rows = Array.from(table.querySelectorAll("tbody tr"));
    rows.forEach(row => {
        const taskName = row.cells[0].textContent;
        scores[taskName] = {};
        selectedPlayers.forEach((player, idx) => {
        if (row.id === "totalRow") return;

            const value = parseInt(row.cells[idx + 1].querySelector("input").value) || 0;
            scores[taskName][player] = value;

            // Replace input with text
            row.cells[idx + 1].textContent = value;
        });
    });

  fetch(`${API_URL}/matches/scores/`, {
    method: "POST",
    headers: {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        match_id: currentMatch.match_id,
        scores: scores
    })

});
    console.log("Sending payload:",
    {
    match_id: currentMatch.match_id,
    scores: scores
    })
    console.log("Current Scores:", scores);
    alert("Scores have been entered into the table. Check console for details.");
});

  function recalculateTotals() {
    const table = tasksContainer.querySelector("table");
    if (!table) return;

    const totals = {};
    selectedPlayers.forEach(p => totals[p] = 0);

    const rows = Array.from(table.querySelectorAll("tbody tr"));

    rows.forEach(row => {
        // Skip total row
        if (row.id === "totalRow") return;

        selectedPlayers.forEach((player, idx) => {
            const cell = row.cells[idx + 1];
            if (!cell) return;

            const input = cell.querySelector("input");
            if (!input) return;   // 🔑 WICHTIG
            const value = parseInt(input.value) || 0;
            totals[player] += value;
        });
    });

    // Write totals
    const totalRow = document.getElementById("totalRow");
    if (!totalRow) return;

    selectedPlayers.forEach((player, idx) => {
        totalRow.cells[idx + 1].textContent = totals[player];
    });
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kingdom Builder Tool</title>

  <style>
    #language-switcher {
      position: fixed;
      top: 10px;
      right: 10px;
    }

    /* ===== GENERAL ===== */
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    .hidden {
      display: none;
    }

    h1, h3 { margin-top: 0; }

    /* ===== LAYOUT ===== */
    .main-layout {
      display: flex;
      gap: 20px;
    }

    .left-panel {
      flex: 1;
      max-width: 420px;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .right-panel {
      flex: 2;
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* ===== PLAYER SELECT ===== */
    #playerInputContainer { position: relative; margin-top: 10px; }
    #playerInput { width: 100%; padding: 6px; }

    #suggestions {
      border: 1px solid #ccc;
      max-height: 150px;
      overflow-y: auto;
      position: absolute;
      background: white;
      width: 100%;
      z-index: 10;
    }

    .suggestion-item {
      padding: 5px;
      cursor: pointer;
    }
    .suggestion-item:hover { background: #eee; }

    .player-tag {
      display: inline-block;
      padding: 5px 10px;
      background: #007bff;
      color: white;
      border-radius: 15px;
      margin: 3px;
      cursor: pointer;
    }
    .player-tag:hover { background: #0056b3; }

    /* ===== BUTTONS ===== */
    button {
      margin-top: 10px;
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    button:hover { background: #0056b3; }

    /* ===== TABLE ===== */
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
      background: white;
    }

    table, th, td {
      border: 1px solid #ccc;
    }

    th, td {
      padding: 6px;
      text-align: center;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
    }

    input.score-input {
      width: 60px;
      text-align: center;
    }

    /* ===== MAP GRID ===== */
    .map-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .map-tile {
      border: 1px solid #444;
      padding: 10px;
      background: #fafafa;
      border-radius: 6px;
    }

    .map-title {
      font-weight: bold;
    }

    .map-meta {
      font-size: .9em;
      color: #555;
    }

    /* ===== MODAL ===== */
    #matchDetailModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      padding: 40px;
      z-index: 9999;
    }

    #matchDetailBox {
      background: white;
      padding: 20px;
      max-width: 900px;
      margin: auto;
      border-radius: 10px;
    }

    .match-meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 15px 0 20px 0;
    }

    .match-meta-card {
      background: #fafafa;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      text-align: center;
    }

    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .player-left {
      flex: 1;
    }

    .player-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ===== STATISTICS ===== */
    #statisticsSection { margin-top: 24px; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,.08); }
    .stats-intro { color: #555; }
    .stats-filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; padding: 14px; background: #f7f9fc; border: 1px solid #e0e5eb; border-radius: 8px; }
    .stats-filters label { display: flex; flex-direction: column; gap: 5px; font-size: .9rem; }
    .stats-filters input, .stats-filters select { min-width: 130px; max-width: 210px; padding: 7px; border: 1px solid #bbb; border-radius: 4px; background: #fff; }
    .stats-view-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
    .stats-view-tabs .stats-tab { background: #e8edf5; color: #222; }
    .stats-view-tabs .stats-tab.active { background: #007bff; color: white; }
    #statsStatus { margin: 10px 0; color: #555; }
    .stats-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 12px 0 20px; }
    .stats-card { border: 1px solid #e0e5eb; border-radius: 8px; padding: 14px; background: #fbfcfe; }
    .stats-card .value { display: block; font-size: 1.55rem; font-weight: bold; margin-top: 6px; }
    .stats-chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .stats-chart { min-width: 0; padding: 12px; border: 1px solid #e0e5eb; border-radius: 8px; overflow-x: auto; }
    .stats-chart h3 { margin: 0 0 10px; }
    .stats-chart svg { display: block; max-width: 100%; overflow: visible; }
    .stats-table-wrap { overflow-x: auto; }
    .stats-table-wrap table { min-width: 650px; }
    .stats-table-wrap th { background: #f0f3f7; position: sticky; top: 0; }
    .stats-table-wrap td, .stats-table-wrap th { padding: 8px; }
    .stats-muted { color: #666; font-size: .9rem; }
    .stats-positive { color: #19733b; }
    .stats-negative { color: #a52b2b; }
    .stats-empty { padding: 20px; background: #f8f8f8; border-radius: 8px; }
    @media (max-width: 800px) { .main-layout { flex-direction: column; } .left-panel { max-width: none; } .match-meta-grid { grid-template-columns: 1fr; } #statisticsSection { padding: 12px; } }

  </style>
</head>

<body>

  <div id="language-switcher">
    <button onclick="loadLanguage('de')">DE</button>
    <button onclick="loadLanguage('en')">EN</button>
  </div>

  <!-- MATCH DETAIL MODAL -->
  <div id="matchDetailModal">
    <div id="matchDetailBox">
      <button onclick="closeMatchDetails()" data-i18n="close"></button>
      <div id="matchDetailContent"></div>
    </div>
  </div>

  <div class="main-layout">

    <!-- LEFT PANEL -->
    <div class="left-panel">
      <form autocomplete="off">
        <h1>Kingdom Builder</h1>

        <label data-i18n="player_count"></label>

        <select id="playerCount">
          <option value="" data-i18n="select_players"></option>
          <option value="2" data-i18n="players_count" data-count="2"></option>
          <option value="3" data-i18n="players_count" data-count="3"></option>
          <option value="4" data-i18n="players_count" data-count="4"></option>
          <option value="5" data-i18n="players_count" data-count="5"></option>
        </select>

        <h3 data-i18n="select_players"></h3>

        <div id="playerInputContainer">
          <input id="playerInput" data-i18n-placeholder="enter_player_name" disabled>
          <div id="suggestions"></div>
        </div>

        <div class="player-row">
          <div class="player-left">
            <div id="selectedPlayers"></div>
            <p data-i18n="selected_players">: <b id="playerCountDisplay">0</b></p>
          </div>

          <div class="player-right">
            <label for="startPlayer">Start Player:</label>
            <select id="startPlayer"></select>
          </div>
        </div>

        <button id="startGameBtn" disabled data-i18n="create_match"></button>
      </form>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <h3 data-i18n="match_settings"></h3>
      <div id="matchSettings">No match created yet!!</div>

      <h3 id="tasks_and_scores" data-i18n="tasks_scores" class="hidden"></h3>
      <div id="tasksContainer"></div>

      <button id="saveScoresBtn" class="hidden" data-i18n="save_scores"></button>
    </div>

  </div>

  <hr>

  <!-- MATCH HISTORY -->
  <h3 data-i18n="played_matches"></h3>

  <div id="matchFilters">
    <label data-i18n="player_count"></label>

    <select id="filterPlayerCount">
      <option value="" data-i18n="all"></option>
      <option value="2" data-i18n="players_count" data-count="2"></option>
      <option value="3" data-i18n="players_count" data-count="3"></option>
      <option value="4" data-i18n="players_count" data-count="4"></option>
      <option value="5" data-i18n="players_count" data-count="5"></option>
    </select>

    <label data-i18n="player_name"></label>
    <input id="filterPlayerName" data-i18n-placeholder="enter_name">
  </div>

  <div id="matchHistoryControls" style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:12px 0;">
    <label for="matchLimit">Angezeigte Spiele / Matches to show:</label>
    <select id="matchLimit">
      <option value="10">10</option>
      <option value="20" selected>20</option>
      <option value="50">50</option>
      <option value="100">100</option>
      <option value="all">Alle / All</option>
    </select>
    <span id="matchHistoryCount" aria-live="polite"></span>
  </div>

  <div id="matchHistory"></div>

  <hr>

  <!-- STATISTICS -->
  <section id="statisticsSection">
    <h2 data-i18n="statistics">Statistics / Statistiken</h2>
    <p class="stats-intro" id="statsIntro">Analyse all recorded Kingdom Builder matches. Filters are shared across the views.</p>

    <div class="stats-filters">
      <label><span data-i18n="from_date">From</span><input type="date" id="statsFromDate"></label>
      <label><span data-i18n="to_date">To</span><input type="date" id="statsToDate"></label>
      <label><span data-i18n="player_count">Players</span>
        <select id="statsPlayerCount"><option value="">All</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option></select>
      </label>
      <label><span data-i18n="player">Player</span><select id="statsPlayer"><option value="">All players</option></select></label>
      <label><span data-i18n="opponent">Opponent</span><select id="statsOpponent"><option value="">All opponents</option></select></label>
      <label><span data-i18n="single_match">Match</span><select id="statsMatch"><option value="">All matches</option></select></label>
      <button type="button" id="resetStatsFilters">Reset filters</button>
    </div>

    <div class="stats-view-tabs" role="tablist" aria-label="Statistics views">
      <button type="button" class="stats-tab active" data-view="players">Players</button>
      <button type="button" class="stats-tab" data-view="days">Daily stats</button>
      <button type="button" class="stats-tab" data-view="content">Game content</button>
      <button type="button" class="stats-tab" data-view="personal">Personal stats</button>
    </div>
    <div id="statsStatus" aria-live="polite"></div>
    <div id="statsViewContent"></div>
  </section>


  <!-- IMPORTANT: Scripts at the end -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="/script/i18n.js"></script>
  

  <script>
    /* ================= AUTH ================= */
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "/static/index.html";

    if (!localStorage.getItem("token")) {
      window.location.replace("/");
    }

    /* ================= GLOBALS ================= */
    let users = [], selectedPlayers = [], currentTasks = [], currentMatch = null, MAX_PLAYERS = 0, allMatches = [];
    let editingMatchId = null;

    const input = document.getElementById("playerInput");
    const suggestions = document.getElementById("suggestions");
    const selectedContainer = document.getElementById("selectedPlayers");
    const countDisplay = document.getElementById("playerCountDisplay");
    const startBtn = document.getElementById("startGameBtn");
    const matchSettingsDiv = document.getElementById("matchSettings");
    const tasksContainer = document.getElementById("tasksContainer");
    const saveScoresBtn = document.getElementById("saveScoresBtn");

    window.addEventListener("DOMContentLoaded", async () => {
      playerCount.value = "";
      MAX_PLAYERS = 0;
      selectedPlayers = [];
      renderSelectedPlayers();
      renderStartPlayerSelect();
      saveScoresBtn.classList.add("hidden");
      updateStartButton();

      await fetchUsers();
      await fetchMyMatches();
    });

    /* ================= API LOAD ================= */
    async function fetchUsers() {
      users = await fetch("/users", { headers: { Authorization: `Bearer ${token}` } }).then(r => r.json());
    }

    async function fetchMyMatches() {
      allMatches = await fetch("/matches/my", { headers: { Authorization: `Bearer ${token}` } }).then(r => r.json());
      renderMatchHistory(allMatches);

      populateStatsFilters();
      scheduleStatsUpdate();
    }

    /* ================= PLAYER SELECTION ================= */
    playerCount.addEventListener("change", e => {
      MAX_PLAYERS = +e.target.value || 0;
      selectedPlayers = [];
      renderSelectedPlayers();
      input.disabled = !MAX_PLAYERS;
      updateStartButton();
    });

    input.addEventListener("input", () => {
      const q = input.value.toLowerCase();
      suggestions.innerHTML = "";
      if (!q) return;

      users.filter(u => u.name.toLowerCase().includes(q) && !selectedPlayers.includes(u.name))
        .forEach(u => {
          const d = document.createElement("div");
          d.textContent = u.name;
          d.className = "suggestion-item";
          d.onclick = () => addPlayer(u.name);
          suggestions.appendChild(d);
        });
    });

    function addPlayer(name) {
      if (selectedPlayers.length >= MAX_PLAYERS) return;
      selectedPlayers.push(name);
      input.value = "";
      suggestions.innerHTML = "";
      renderSelectedPlayers();
      renderStartPlayerSelect();
      updateStartButton();
    }

    function removePlayer(name) {
      selectedPlayers = selectedPlayers.filter(p => p !== name);
      renderSelectedPlayers();
      renderStartPlayerSelect();
      updateStartButton();
    }

    function renderSelectedPlayers() {
      selectedContainer.innerHTML = "";
      selectedPlayers.forEach(p => {
        const s = document.createElement("span");
        s.textContent = p;
        s.className = "player-tag";
        s.onclick = () => removePlayer(p);
        selectedContainer.appendChild(s);
      });
      countDisplay.textContent = selectedPlayers.length;
    }

    function updateStartButton() {
      startBtn.disabled = !(selectedPlayers.length === MAX_PLAYERS && MAX_PLAYERS > 0);
    }

    /* ================= START MATCH ================= */
    startBtn.onclick = async () => {
      if (startBtn.disabled) return;

      startBtn.disabled = true;

      try {
        const startPlayer = document.getElementById("startPlayer").value;

        const res = await fetch("/start_kingdom_builder", {
          method: "POST",
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            players: selectedPlayers,
            start_player: startPlayer
          })
        });

        currentMatch = await res.json();
        if (!res.ok) {
          alert(JSON.stringify(currentMatch));
          return;
        }

        renderMatchSettings(currentMatch);
        currentTasks = [...new Map(currentMatch.tasks.map(t => [t.name, t])).values()];
        renderTasks();

        saveScoresBtn.classList.remove("hidden");
        tasks_and_scores.classList.remove("hidden");

        await fetchMyMatches();
      } finally {
        startBtn.disabled = false;
      }
    };

    /* ================= MAP & SETTINGS ================= */
    function renderMatchSettings(m) {
      matchSettingsDiv.innerHTML = "";
      matchSettingsDiv.appendChild(renderMap(m.map));

      const infoFields = [
        { label: t("island"), value: m.island },
        { label: t("caves"), value: Array.isArray(m.caves) ? m.caves.join(", ") : m.caves },
        { label: t("capitols"), value: m.capitols }
      ];

      infoFields.forEach(field => {
        const value = typeof field.value === "string" ? t(field.value) : field.value;
        const p = document.createElement("p");
        p.innerHTML = `<b>${field.label}:</b> ${value}`;
        matchSettingsDiv.appendChild(p);
      });
    }

    function renderMap(map) {
      const grid = document.createElement("div");
      grid.className = "map-grid";
      map.forEach(([id, exp, name, , , , , , ori]) => {
        const d = document.createElement("div");
        d.className = "map-tile";
        d.innerHTML = `<div class="map-title">${t(name)}</div>
                       <div class="map-meta">${exp} · ${ori === "upright" ? t("upright") : t("reversed")}</div>`;
        grid.appendChild(d);
      });
      return grid;
    }

    /* ================= TASK TABLE ================= */
    function renderTasks() {
      tasksContainer.innerHTML = "";

      if (!currentTasks?.length || !currentMatch) {
        tasksContainer.textContent = t("no_match_created_yet");
        saveScoresBtn.classList.add("hidden");
        return;
      }

      const table = document.createElement("table");

      const thead = document.createElement("thead");
      const hr = document.createElement("tr");

      const thTask = document.createElement("th");
      thTask.textContent = t("task");
      hr.appendChild(thTask);

      selectedPlayers.forEach(p => {
        const th = document.createElement("th");
        th.textContent = p;
        hr.appendChild(th);
      });

      thead.appendChild(hr);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");

      const uniqueTasks = [...new Map(currentTasks.map(t => [t.name, t])).values()];

      uniqueTasks.forEach(task => {
        const tr = document.createElement("tr");
        const tdTask = document.createElement("td");
        tdTask.textContent = t(task.name);
        tdTask.dataset.task = task.name;
        tr.appendChild(tdTask);

        selectedPlayers.forEach(() => {
          const td = document.createElement("td");
          const inp = document.createElement("input");
          inp.type = "number";
          inp.value = 0;
          inp.className = "score-input";
          inp.addEventListener("input", () => inp.value = inp.value.replace(/[^0-9]/g, ""));
          inp.addEventListener("blur", () => { if (inp.value === "") inp.value = 0; });
          inp.addEventListener("input", recalculateTotals);
          td.appendChild(inp);
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });

      const totalRow = document.createElement("tr");
      totalRow.id = "totalRow";

      const tdTotal = document.createElement("td");
      tdTotal.innerHTML = `<b>${t("total")}</b>`;
      totalRow.appendChild(tdTotal);

      selectedPlayers.forEach(() => {
        const td = document.createElement("td");
        td.textContent = "0";
        totalRow.appendChild(td);
      });

      tbody.appendChild(totalRow);
      table.appendChild(tbody);
      tasksContainer.appendChild(table);

      saveScoresBtn.disabled = false;
    }

    function recalculateTotals() {
      const table = tasksContainer.querySelector("table");
      if (!table) return;

      const totals = Object.fromEntries(selectedPlayers.map(p => [p, 0]));

      table.querySelectorAll("tbody tr").forEach(row => {
        if (row.id === "totalRow") return;

        selectedPlayers.forEach((p, i) => {
          const v = parseInt(row.cells[i + 1].querySelector("input")?.value) || 0;
          totals[p] += v;
        });
      });

      const totalRow = document.getElementById("totalRow");
      selectedPlayers.forEach((p, i) => totalRow.cells[i + 1].textContent = totals[p]);
    }

    /* ================= SAVE SCORES ================= */
    saveScoresBtn.onclick = async () => {
      const table = tasksContainer.querySelector("table");
      const scores = {};

      table.querySelectorAll("tbody tr").forEach(row => {
        if (row.id === "totalRow") return;

        const task = row.cells[0].dataset.task;
        scores[task] = {};

        selectedPlayers.forEach((p, i) => {
          const input = row.cells[i + 1].querySelector("input");
          const v = parseInt(input.value) || 0;
          scores[task][p] = v;
        });
      });

      const res = await fetch(`/matches/${currentMatch.match_id}/scores`, {
        method: "PATCH",
        headers: {
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ scores })
      });

      if (!res.ok) {
        alert("Save failed");
        return;
      }

      saveScoresBtn.disabled = true;
      table.querySelectorAll("input").forEach(inp => inp.disabled = true);

      await fetchMyMatches();
      alert("Scores saved!");
    };

    /* ================= MATCH HISTORY ================= */
    function renderMatchHistory(matches) {
      const container = document.getElementById("matchHistory");
      const countLabel = document.getElementById("matchHistoryCount");
      container.innerHTML = "";

      if (!matches.length) {
        container.textContent = t("no_matches_yet");
        countLabel.textContent = "";
        return;
      }

      // Work on a copy so sorting does not mutate allMatches or the filtered array.
      const sortedMatches = [...matches].sort(
        (a, b) => new Date(b.created_at) - new Date(a.created_at)
      );

      const limitValue = document.getElementById("matchLimit")?.value || "20";
      const visibleMatches = limitValue === "all"
        ? sortedMatches
        : sortedMatches.slice(0, Math.max(1, parseInt(limitValue, 10) || 20));

      const language = (typeof currentLang !== "undefined" ? currentLang : "en");
      countLabel.textContent = language === "de"
        ? `${visibleMatches.length} von ${sortedMatches.length} Spielen angezeigt`
        : `Showing ${visibleMatches.length} of ${sortedMatches.length} matches`;

      const table = document.createElement("table");

      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");

      const thDate = document.createElement("th");
      thDate.setAttribute("data-i18n", "date");

      const thID = document.createElement("th");
      thID.setAttribute("data-i18n", "match_id");

      const thPlayers = document.createElement("th");
      thPlayers.setAttribute("data-i18n", "players");

      const thStartPlayer = document.createElement("th");
      thStartPlayer.setAttribute("data-i18n", "start_player");

      const thScores = document.createElement("th");
      thScores.setAttribute("data-i18n", "scores");

      const thDetails = document.createElement("th");
      thDetails.setAttribute("data-i18n", "details");

      headerRow.append(thDate, thID, thPlayers, thStartPlayer, thScores, thDetails);
      thead.appendChild(headerRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");

      visibleMatches.forEach(m => {
        const tr = document.createElement("tr");

        const tdDate = document.createElement("td");
        tdDate.textContent = m.date;

        const tdID = document.createElement("td");
        tdID.textContent = m.match_id || "x";

        const tdCount = document.createElement("td");
        tdCount.textContent = m.player_count || "x";

        const tdStartPlayer = document.createElement("td");
        tdStartPlayer.textContent = m.start_player || "x";

        const tdScores = document.createElement("td");

        const scoresArray = Object.values(m.scores || {});
        const max = Math.max(...scoresArray.map(s => s.score || 0));

        scoresArray.forEach((s, i) => {
          const element = document.createElement(s.score === max ? "b" : "span");
          element.textContent = `${s.username}:${s.score}`;
          tdScores.appendChild(element);

          if (i < scoresArray.length - 1) {
            tdScores.appendChild(document.createTextNode(" | "));
          }
        });

        const tdBtn = document.createElement("td");
        const btn = document.createElement("button");
        btn.textContent = "🔍";
        btn.title = t("show_details");
        btn.addEventListener("click", () => showMatchDetails(m.match_id));

        tdBtn.appendChild(btn);

        tr.append(tdDate, tdID, tdCount, tdStartPlayer, tdScores, tdBtn);
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      container.appendChild(table);

      loadLanguage(currentLang);
      populateStatsFilters();
      scheduleStatsUpdate();
    }

    /* ================= FILTERS ================= */

        const taskValues = Array.isArray(detail.tasks) ? detail.tasks.map(v => typeof v === "object" ? (v.name || v.task || JSON.stringify(v)) : String(v)) : normaliseItems(detail.tasks);
        taskValues.forEach(v=>tasks.push(v));

if (Array.isArray(detail.map) && detail.map.length === 0) {
  // map data not available
  tiles.push("[] (no data)");
} else {
  const mapValues = Array.isArray(detail.map)
    ? detail.map.map(v =>
        Array.isArray(v)
          ? (v[2] || v[0] || JSON.stringify(v))
          : (typeof v === "object"
              ? (v.name || JSON.stringify(v))
              : String(v))
      )
    : normaliseItems(detail.map);

  mapValues.forEach(v => tiles.push(v));
}

// Caves grouped into three categories: 0, 1 or N/A
if (detail.caves === "0") {
    caves.push("0");
} else if (detail.caves === "caves" || Array.isArray(detail.caves)) {
    caves.push("1");
} else {
    caves.push("N/A");
}
islands.push(...normaliseItems(detail.island));
        capitols.push(detail.capitols===0||detail.capitols?String(detail.capitols):"unknown");
        if(match.start_player)startPlayers.push({match,detail,player:match.start_player});
      });
      renderDistribution(grid,st("tasks"),tasks);renderDistribution(grid,st("mapTiles"),tiles);renderDistribution(grid,st("caves"),caves);renderDistribution(grid,st("islands"),islands);renderDistribution(grid,st("capitols"),capitols);
      const starts=new Map();startPlayers.forEach(({match,player})=>{const w=matchWinnerNames(match).includes(player);if(!starts.has(player))starts.set(player,{played:0,wins:0});const r=starts.get(player);r.played++;if(w)r.wins++;});
      const startBox=chartContainer(st("startPlayer"));grid.appendChild(startBox);if(starts.size){const rows=[...starts.entries()].map(([name,r])=>[name,r.played,r.wins,`${(r.wins/r.played*100).toFixed(1)}%`]);startBox.appendChild(renderStatsTable([st("players"),st("matches"),st("wins"),st("startWinRate")],rows));}else startBox.appendChild(makeElement("p",st("noData"),"stats-muted"));
    }
    function longestStreak(matches, player, shouldWin) { let best=0,current=0;matches.forEach(m=>{const scores=scoreEntries(m);if(!scores.some(s=>s.username===player)){current=0;return;}const won=matchWinnerNames(m).includes(player);if(won===shouldWin){current++;best=Math.max(best,current);}else current=0;});return best; }
    function renderPersonalStats(matches) {
      const player=document.getElementById("statsPlayer").value; if(!player){statsContent.appendChild(makeElement("p",st("noPlayer"),"stats-empty"));return;}
      const appearances=matches.filter(m=>(m.players||[]).some(p=>p.username===player)); if(!appearances.length){statsContent.appendChild(makeElement("p",st("noMatches"),"stats-empty"));return;}
      const scores=appearances.flatMap(m=>scoreEntries(m).filter(s=>s.username===player).map(s=>({match:m,score:s.score,won:matchWinnerNames(m).includes(player)})));
      const gaps=appearances.map(m=>{const ss=scoreEntries(m),mine=ss.find(s=>s.username===player);const other=ss.filter(s=>s.username!==player);return mine&&other.length?{match:m,gap:mine.score-Math.max(...other.map(s=>s.score)),score:mine.score}:null;}).filter(Boolean);
      const bestGap=gaps.length?gaps.reduce((a,b)=>a.gap>b.gap?a:b):null; const high=scores.length?Math.max(...scores.map(s=>s.score)):null; const low=scores.length?Math.min(...scores.map(s=>s.score)):null;
      const cards=makeElement("div",null,"stats-cards");cards.append(makeCard(st("matches"),appearances.length),makeCard(st("wins"),scores.filter(s=>s.won).length),makeCard(st("losses"),scores.filter(s=>!s.won).length),makeCard(st("winRate"),`${(scores.filter(s=>s.won).length/Math.max(1,scores.length)*100).toFixed(1)}%`),makeCard(st("highest"),high??"—"),makeCard(st("lowest"),low??"—"),makeCard(st("bestGap"),bestGap?`${bestGap.gap>0?"+":""}${bestGap.gap} (#${bestGap.match.match_id})`:"—"),makeCard(st("longestWin"),longestStreak(appearances,player,true)),makeCard(st("longestLoss"),longestStreak(appearances,player,false)));statsContent.appendChild(cards);
      const opponentStats=new Map();appearances.forEach(m=>{const ss=scoreEntries(m),mine=ss.find(s=>s.username===player);if(!mine)return;ss.filter(s=>s.username!==player).forEach(o=>{if(!opponentStats.has(o.username))opponentStats.set(o.username,{played:0,wins:0,points:0,opponentPoints:0});const r=opponentStats.get(o.username);r.played++;r.points+=mine.score;r.opponentPoints+=o.score;if(mine.score>o.score)r.wins++;});});
      const opponents=[...opponentStats.entries()].map(([name,r])=>({...r,name,winRate:r.played?r.wins/r.played*100:0,avgDiff:(r.points-r.opponentPoints)/r.played})).sort((a,b)=>b.winRate-a.winRate);
      const bestOpp=opponents.filter(o=>o.played>=1).sort((a,b)=>b.winRate-a.winRate)[0];const hardest=opponents.filter(o=>o.played>=1).sort((a,b)=>a.winRate-b.winRate)[0];
      const opponentBox=chartContainer(`${st("bestOpponent")} / ${st("hardestOpponent")}`);statsContent.appendChild(opponentBox);opponentBox.appendChild(renderStatsTable([st("opponent"),st("matches"),st("wins"),st("winRate"),st("avgDiff")],opponents.map(o=>[o.name,o.played,o.wins,`${o.winRate.toFixed(1)}%`,`${o.avgDiff>0?"+":""}${o.avgDiff.toFixed(1)}`])));
      const bestDayMap=new Map();scores.forEach(s=>{const day=matchDay(s.match);if(!day)return;if(!bestDayMap.has(day))bestDayMap.set(day,{day,points:0,matches:0});const d=bestDayMap.get(day);d.points+=s.score;d.matches++;});const bestDay=[...bestDayMap.values()].sort((a,b)=>(b.points/b.matches)-(a.points/a.matches))[0];
      const summary=makeElement("p",`${st("bestOpponent")}: ${bestOpp?`${bestOpp.name} (${bestOpp.winRate.toFixed(1)}%)`:"—"} · ${st("hardestOpponent")}: ${hardest?`${hardest.name} (${hardest.winRate.toFixed(1)}%)`:"—"} · ${st("bestDay")}: ${bestDay?`${bestDay.day} (${(bestDay.points/bestDay.matches).toFixed(1)} Ø)`:"—"}`,"stats-muted");statsContent.appendChild(summary);
    }
    async function updateStatsDashboard() {
      if(!statsContent)return;
      const matches=currentFilteredMatches(); statsState.filteredMatches=matches; statsContent.innerHTML="";
      if(!matches.length){statsStatus.textContent="";statsContent.appendChild(makeElement("p",st("noMatches"),"stats-empty"));return;}
      if(statsState.view==="players"){statsStatus.textContent=`${matches.length} ${st("matches")}`;renderPlayerStats(matches);return;}
      statsStatus.textContent=`${matches.length} ${st("matches")} · ${st("loading")}`;
      const details=await loadStatsDetails(matches);statsState.filteredDetails=details;
      const failed=details.filter(x=>x.error).length;
      statsStatus.textContent=`${matches.length} ${st("matches")}${failed?` · ${failed} detail(s) unavailable`:""}`;
      statsContent.innerHTML="";
      if(statsState.view==="days")renderDailyStats(matches);
      else if(statsState.view==="content")await renderGameContent(details);
      else if(statsState.view==="personal")renderPersonalStats(matches);
    }
    let statsRenderRequest=0;
    function scheduleStatsUpdate() { refreshStatsLabels(); const request=++statsRenderRequest; updateStatsDashboard().catch(err=>{console.error("Statistics error",err);if(request===statsRenderRequest){statsStatus.textContent=err.message;}}); }
    document.querySelectorAll(".stats-tab").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".stats-tab").forEach(b=>b.classList.toggle("active",b===btn));statsState.view=btn.dataset.view;scheduleStatsUpdate();}));
    ["statsFromDate","statsToDate","statsPlayerCount","statsPlayer","statsOpponent","statsMatch"].forEach(id=>document.getElementById(id).addEventListener("change",scheduleStatsUpdate));
    document.getElementById("resetStatsFilters").addEventListener("click",()=>{["statsFromDate","statsToDate","statsPlayerCount","statsPlayer","statsOpponent","statsMatch"].forEach(id=>document.getElementById(id).value="");scheduleStatsUpdate();});

  </script>

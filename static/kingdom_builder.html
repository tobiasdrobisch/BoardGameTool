<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kingdom Builder Tool</title>

<style>
/* ===== GENERAL ===== */
body {
  font-family: Arial, sans-serif;
  padding: 20px;
  background:#f5f5f5;
}

h1,h3 { margin-top:0 }

/* ===== LAYOUT ===== */
.main-layout {
  display:flex;
  gap:20px;
}

.left-panel {
  flex:1;
  max-width:420px;
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.right-panel {
  flex:2;
  background:white;
  padding:15px;
  border-radius:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

/* ===== PLAYER SELECT ===== */
#playerInputContainer { position:relative; margin-top:10px; }
#playerInput { width:100%; padding:6px; }

#suggestions {
  border:1px solid #ccc;
  max-height:150px;
  overflow-y:auto;
  position:absolute;
  background:white;
  width:100%;
  z-index:10;
}

.suggestion-item {
  padding:5px;
  cursor:pointer;
}
.suggestion-item:hover { background:#eee; }

.player-tag {
  display:inline-block;
  padding:5px 10px;
  background:#007bff;
  color:white;
  border-radius:15px;
  margin:3px;
  cursor:pointer;
}
.player-tag:hover { background:#0056b3; }

/* ===== BUTTONS ===== */
button {
  margin-top:10px;
  padding:8px 12px;
  border:none;
  border-radius:5px;
  background:#007bff;
  color:white;
  cursor:pointer;
  opacity:.5;
}

button.enabled {
  opacity:1;
}

button:hover { background:#0056b3; }

/* ===== TABLE ===== */
table {
  border-collapse:collapse;
  width:100%;
  margin-top:10px;
  background:white;
}

table, th, td {
  border:1px solid #ccc;
}

th, td {
  padding:6px;
  text-align:center;
}

/* number arrows remove */
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
  -webkit-appearance:none;
}

input.score-input {
  width:60px;
  text-align:center;
}

/* ===== MAP GRID ===== */
.map-grid {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:10px;
}

.map-tile {
  border:1px solid #444;
  padding:10px;
  background:#fafafa;
  border-radius:6px;
}

.map-title {
  font-weight:bold;
}

.map-meta {
  font-size:.9em;
  color:#555;
}

/* ===== MODAL ===== */
#matchDetailModal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  padding:40px;
  z-index:9999;
}

#matchDetailBox {
  background:white;
  padding:20px;
  max-width:900px;
  margin:auto;
  border-radius:10px;
}
</style>
</head>

<body>

<!-- MATCH DETAIL MODAL -->
<div id="matchDetailModal">
  <div id="matchDetailBox">
    <button onclick="closeMatchDetails()">Close</button>
    <div id="matchDetailContent"></div>
  </div>
</div>

<div class="main-layout">

<!-- LEFT PANEL -->
<div class="left-panel">
<h1>Kingdom Builder</h1>

<label>Player count:</label>
<select id="playerCount">
  <option value="">Select players</option>
  <option value="2">2 Players</option>
  <option value="3">3 Players</option>
  <option value="4">4 Players</option>
  <option value="5">5 Players</option>
</select>

<h3>Select players</h3>
<div id="playerInputContainer">
  <input id="playerInput" placeholder="Enter player name..." disabled>
  <div id="suggestions"></div>
</div>

<div id="selectedPlayers"></div>
<p>Selected players: <b id="playerCountDisplay">0</b></p>

<button id="startGameBtn" disabled>Create Match</button>
</div>

<!-- RIGHT PANEL -->
<div class="right-panel">
<h3>Match Settings</h3>
<div id="matchSettings">No match created yet.</div>

<h3>Tasks & Scores</h3>
<div id="tasksContainer"></div>
<button id="saveScoresBtn" disabled>Save Scores</button>
</div>

</div>

<hr>

<!-- MATCH HISTORY -->
<h3>Played Matches</h3>

<div id="matchFilters">
Player count:
<select id="filterPlayerCount">
  <option value="">All</option>
  <option value="2">2</option>
  <option value="3">3</option>
  <option value="4">4</option>
  <option value="5">5</option>
</select>

Player name:
<input id="filterPlayerName" placeholder="Enter name...">
</div>

<div id="matchHistory"></div>

<script>
/* ================= AUTH ================= */
const token = localStorage.getItem("token");
if (!token) window.location.href="/static/index.html";

/* ================= GLOBALS ================= */
let users=[], selectedPlayers=[], currentTasks=[], currentMatch=null, MAX_PLAYERS=0, allMatches=[];

const input = playerInput;
const suggestions = document.getElementById("suggestions");
const selectedContainer = selectedPlayersDiv = document.getElementById("selectedPlayers");
const countDisplay = playerCountDisplay;
const startBtn = startGameBtn;
const matchSettingsDiv = matchSettings;
const tasksContainer = tasksContainerDiv = document.getElementById("tasksContainer");
const saveScoresBtn = saveScoresBtnEl = document.getElementById("saveScoresBtn");

window.addEventListener("DOMContentLoaded", async () => {
  await fetchUsers();
  await fetchMyMatches();
});


/* ================= API LOAD ================= */
async function fetchUsers(){
  users = await fetch("/users/",{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json());
}

async function fetchMyMatches(){
  allMatches = await fetch("/matches/my",{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json());
  renderMatchHistory(allMatches);
}

/* ================= PLAYER SELECTION ================= */
playerCount.addEventListener("change", e=>{
  MAX_PLAYERS = +e.target.value || 0;
  selectedPlayers=[];
  renderSelectedPlayers();
  input.disabled=!MAX_PLAYERS;
  updateStartButton();
});

input.addEventListener("input", ()=>{
  const q=input.value.toLowerCase();
  suggestions.innerHTML="";
  if(!q) return;

  users.filter(u=>u.name.toLowerCase().includes(q) && !selectedPlayers.includes(u.name))
       .forEach(u=>{
        const d=document.createElement("div");
        d.textContent=u.name;
        d.className="suggestion-item";
        d.onclick=()=>addPlayer(u.name);
        suggestions.appendChild(d);
       });
});

function addPlayer(name){
  if(selectedPlayers.length>=MAX_PLAYERS) return;
  selectedPlayers.push(name);
  input.value="";
  suggestions.innerHTML="";
  renderSelectedPlayers();
  updateStartButton();
}

function removePlayer(name){
  selectedPlayers=selectedPlayers.filter(p=>p!==name);
  renderSelectedPlayers();
  updateStartButton();
}

function renderSelectedPlayers(){
  selectedContainer.innerHTML="";
  selectedPlayers.forEach(p=>{
    const s=document.createElement("span");
    s.textContent=p;
    s.className="player-tag";
    s.onclick=()=>removePlayer(p);
    selectedContainer.appendChild(s);
  });
  countDisplay.textContent=selectedPlayers.length;
}

function updateStartButton(){
  startBtn.disabled = !(selectedPlayers.length===MAX_PLAYERS && MAX_PLAYERS>0);
  startBtn.classList.toggle("enabled", !startBtn.disabled);
}

/* ================= START MATCH ================= */
startBtn.onclick = async ()=>{
  const res = await fetch("/start_kingdom_builder/",{
    method:"POST",
    headers:{
      Authorization:`Bearer ${token}`,
      "Content-Type":"application/json"
    },
    body:JSON.stringify(selectedPlayers)
  });

  currentMatch = await res.json();
  if(!res.ok){ alert(JSON.stringify(currentMatch)); return; }

  renderMatchSettings(currentMatch);
  currentTasks = currentMatch.tasks;
  renderTasks();

  await fetchMyMatches();
};

/* ================= MAP & SETTINGS ================= */
function renderMatchSettings(m){
  matchSettingsDiv.innerHTML="";
  matchSettingsDiv.appendChild(renderMap(m.map));
  matchSettingsDiv.innerHTML += `
    <p><b>Island:</b> ${m.island}</p>
    <p><b>Caves:</b> ${m.caves}</p>
    <p><b>Capitols:</b> ${m.capitols}</p>`;
}

function renderMap(map){
  const grid=document.createElement("div");
  grid.className="map-grid";
  map.forEach(([id,exp,name,ori])=>{
    const d=document.createElement("div");
    d.className="map-tile";
    d.innerHTML=`<div class="map-title">${name}</div>
                 <div class="map-meta">${exp} · ${ori==="upright"?"↑ upright":"↺ reversed"}</div>`;
    grid.appendChild(d);
  });
  return grid;
}

/* ================= TASK TABLE ================= */
function renderTasks(){
  tasksContainer.innerHTML="";
  if(!currentTasks?.length){ tasksContainer.textContent="No tasks available"; return; }

  const table=document.createElement("table");
  const thead=document.createElement("thead");
  const hr=document.createElement("tr");
  hr.innerHTML="<th>Task</th>"+selectedPlayers.map(p=>`<th>${p}</th>`).join("");
  thead.appendChild(hr);
  table.appendChild(thead);

  const tbody=document.createElement("tbody");

  currentTasks.forEach(task=>{
    const tr=document.createElement("tr");
    tr.innerHTML=`<td>${task.name}</td>`;
    selectedPlayers.forEach(()=>{
      const td=document.createElement("td");
      const inp=document.createElement("input");
      inp.type="number";
      inp.value=0;
      inp.className="score-input";
      inp.oninput=recalculateTotals;
      td.appendChild(inp);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  const totalRow=document.createElement("tr");
  totalRow.id="totalRow";
  totalRow.innerHTML="<td><b>Total</b></td>"+selectedPlayers.map(()=>"<td>0</td>").join("");
  tbody.appendChild(totalRow);

  table.appendChild(tbody);
  tasksContainer.appendChild(table);

  saveScoresBtn.disabled=false;
  saveScoresBtn.classList.add("enabled");
}

/* ================= TOTALS ================= */
function recalculateTotals(){
  const table=tasksContainer.querySelector("table");
  if(!table) return;
  const totals=Object.fromEntries(selectedPlayers.map(p=>[p,0]));

  table.querySelectorAll("tbody tr").forEach(row=>{
    if(row.id==="totalRow") return;
    selectedPlayers.forEach((p,i)=>{
      const v=parseInt(row.cells[i+1].querySelector("input")?.value)||0;
      totals[p]+=v;
    });
  });

  const totalRow=document.getElementById("totalRow");
  selectedPlayers.forEach((p,i)=> totalRow.cells[i+1].textContent=totals[p]);
}

/* ================= SAVE SCORES ================= */
saveScoresBtn.onclick=()=>{
  const table=tasksContainer.querySelector("table");
  const scores={};

  table.querySelectorAll("tbody tr").forEach(row=>{
    if(row.id==="totalRow") return;
    const task=row.cells[0].textContent;
    scores[task]={};
    selectedPlayers.forEach((p,i)=>{
      const v=parseInt(row.cells[i+1].querySelector("input").value)||0;
      scores[task][p]=v;
      row.cells[i+1].textContent=v;
    });
  });

  fetch("/matches/scores/",{
    method:"POST",
    headers:{Authorization:`Bearer ${token}`,"Content-Type":"application/json"},
    body:JSON.stringify({match_id:currentMatch.match_id,scores})
  });

  alert("Scores saved!");
};

/* ================= MATCH HISTORY ================= */
function renderMatchHistory(matches){
  const container=document.getElementById("matchHistory");
  container.innerHTML="";
  if(!matches.length){ container.textContent="No matches yet"; return; }

  matches.sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))

  const table=document.createElement("table");
  table.innerHTML="<thead><tr><th>Date</th><th>Players</th><th>Scores</th><th>Details</th></tr></thead>";
  const tbody=document.createElement("tbody");

  matches.forEach(m=>{
    const max=Math.max(...Object.values(m.scores));
    const html=Object.entries(m.scores).map(([p,s])=>s===max?`<b>${p}:${s}</b>`:`${p}:${s}`).join(" | ");
    const tr=document.createElement("tr");
    tr.innerHTML=`
    <td>${m.date}</td>
    <td>${m.player_count}</td>
    <td>${html}</td>
    <td><button onclick="showMatchDetails(${m.match_id})">🔍</button></td>`
    ;
    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  container.appendChild(table);
}

/* ================= FILTERS ================= */
filterPlayerCount.onchange=applyFilters;
filterPlayerName.oninput=applyFilters;

function applyFilters(){
  let f=allMatches;
  const c=filterPlayerCount.value;
  const n=filterPlayerName.value.toLowerCase();
  if(c) f=f.filter(m=>m.player_count==c);
  if(n) f=f.filter(m=>m.players.some(p=>p.toLowerCase().includes(n)));
  renderMatchHistory(f);
}

/* ================= MATCH DETAIL MODAL ================= */
async function showMatchDetails(id){
  const data = await fetch(`/matches/${id}`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json());
  const div=document.getElementById("matchDetailContent");
  div.innerHTML="<h2>Match Details</h2>";

  if(data.map) div.appendChild(renderMap(data.map));
  div.innerHTML+=`<p><b>Island:</b> ${data.island}</p>
                  <p><b>Caves:</b> ${data.caves}</p>
                  <p><b>Capitols:</b> ${data.capitols}</p>`;

  for(let p in data.players){
    div.innerHTML+=`<h4>${p} (Total: ${data.players[p].total})</h4><ul>`;
    for(let t in data.players[p].details){
      div.innerHTML+=`<li>${t}: ${data.players[p].details[t]}</li>`;
    }
    div.innerHTML+="</ul>";
  }

  matchDetailModal.style.display="block";
}

function closeMatchDetails(){
  matchDetailModal.style.display="none";
}
</script>

</body>
</html>
